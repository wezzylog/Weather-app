<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="js/data.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div class="cities" id="cities" role="group" aria-label="Choose a city"></div>
    <div class="units" role="group" aria-label="Temperature unit">
      <button type="button" id="unitC" aria-pressed="true">°C</button>
      <button type="button" id="unitF" aria-pressed="false">°F</button>
    </div>
  </div>

  <section class="sky" id="sky" aria-live="polite">
    <h1 id="cityName"></h1>
    <p class="when" id="when"></p>
    <div class="now">
      <div class="temp"><span id="tempNow"></span><sup id="unitMark"></sup></div>
      <div class="glyph" id="glyph" aria-hidden="true"></div>
    </div>
    <p class="summary" id="summary"></p>
    <p class="range" id="range"></p>
  </section>

  <section class="panel">
    <h2>Next 24 hours</h2>
    <div class="curve-wrap"><svg id="curve" viewBox="0 0 720 170" role="img" aria-label="Hourly temperature"></svg></div>
  </section>

  <section class="panel">
    <h2>5-day forecast</h2>
    <ul class="days" id="days"></ul>
  </section>

  <dl class="facts" id="facts"></dl>

  <p class="note">Sample data for five cities. Hosted pages can't call live weather services, so these values are built into the page.</p>
</main>
</body>
</html>
